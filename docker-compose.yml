services:
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    environment:
      APP_ENV: dev

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npx next dev -H 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      WATCHPACK_POLLING: "true"

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: "54.37.231.235:29865"

volumes:
  backend_vendor:
  frontend_node_modules:
